name: Build and Push NWNX4 Docker Image

on:
  repository_dispatch:
    types: [nwnx4_release]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TAG_NAME: ${{github.event.client_payload.tag_name}}

    steps:
      - name: Checkout docker repo
        uses: actions/checkout@v4

      - name: Checkout nwnx4 source at tag
        uses: actions/checkout@v4
        with:
          repository: nwn2dev/nwnx4
          ref: ${{env.TAG_NAME}}
          path: nwnx4

      - name: Log tag
        run: echo "Building tag $TAG_NAME"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build Docker Image
        run: |
          docker build ./nwnx4 \
            -t nwn2dev/nwnx4:latest \
            -t nwn2dev/nwnx4:${TAG_NAME}

      - name: Push Images
        run: |
          docker push nwn2dev/nwnx4:latest
          docker push nwn2dev/nwnx4:${TAG_NAME}
